name: git-lofi
description: Draw a GitHub account's lofi Japanese city from its public activity as a looping GIF.
branding:
  icon: moon
  color: purple

inputs:
  login:
    description: Account whose city to draw.
    default: ${{ github.repository_owner }}
  time:
    description:
      auto follows the current hour in `timezone`; or one of day, night, dusk, dawn,
      rain, snow, or sakura.
    default: auto
  location:
    description:
      Where you are, as a city (like Jakarta, or Bandung, Indonesia) or latitude,longitude. Sets
      the live weather, the timezone, and the hemisphere for seasons.
    default: ''
  timezone:
    description: IANA timezone that auto uses, like Asia/Jakarta. Overrides the location's.
    default: ''
  weather:
    description:
      Live weather at latitude,longitude (like -6.21,106.85), or off. Overrides the location's.
    default: ''
  output-dir:
    description: Folder, relative to the workspace, that receives lofi.gif.
    default: lofi
  token:
    description: Token for reading the account's public data; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install git-lofi
      shell: bash
      run: npm ci --omit=dev --prefix "$GITHUB_ACTION_PATH"
    - name: Draw the city
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        LOFI_LOGIN: ${{ inputs.login }}
        LOFI_TIME: ${{ inputs.time }}
        LOFI_TZ: ${{ inputs.timezone }}
        LOFI_WEATHER: ${{ inputs.weather }}
        LOFI_LOCATION: ${{ inputs.location }}
        LOFI_OUT: ${{ inputs.output-dir }}
      run: |
        args=("$LOFI_LOGIN" --time "$LOFI_TIME" --out "$LOFI_OUT")
        if [ -n "$LOFI_LOCATION" ]; then args+=("--location=$LOFI_LOCATION"); fi
        if [ -n "$LOFI_TZ" ]; then args+=("--tz=$LOFI_TZ"); fi
        if [ -n "$LOFI_WEATHER" ]; then args+=("--weather=$LOFI_WEATHER"); fi
        "$GITHUB_ACTION_PATH/node_modules/.bin/tsx" "$GITHUB_ACTION_PATH/src/main.ts" "${args[@]}"
